name: Audio persistence and float-format checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/assets/audio/baron-basic/**'
      - 'docs/reference/baron-basic-audio-decoded.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'tools/assets/audio_float_corpus.py'
      - 'tools/assets/test-audio-float-corpus.py'
      - '.github/workflows/baron-audio.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/assets/audio/baron-basic/**'
      - 'docs/reference/baron-basic-audio-decoded.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'tools/assets/audio_float_corpus.py'
      - 'tools/assets/test-audio-float-corpus.py'
      - '.github/workflows/baron-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baron-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm exec tsc -- --noEmit
      - name: Check committed audio assets, playback and saved tails
        run: >-
          npm exec vitest -- run
          tests/baron-basic-audio-assets.test.ts
          tests/baron-basic-audio-state.test.ts
          tests/baron-basic-audio-controller.test.ts
          tests/baron-basic-audio-history.test.ts
      - name: Check float-master format and headroom without private caches
        run: |
          python3 tools/assets/test-audio-float-corpus.py
          python3 -O tools/assets/test-audio-float-corpus.py
