name: Audio persistence and float-format checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/assets/audio/baron-basic/**'
      - 'public/assets/audio/ahri-charm/**'
      - 'public/assets/audio/ahri-orb/**'
      - 'docs/reference/ahri-q-audio-properties.json'
      - 'docs/reference/ahri-orb-gameplay-reference-v2.json'
      - 'tools/assets/read-ahri-q-audio.py'
      - 'tools/assets/test-ahri-q-audio-reading.py'
      - 'tools/assets/export-ahri-orb-audio.py'
      - 'tools/assets/test-ahri-orb-audio-export.py'
      - 'docs/reference/ahri-charm-gameplay-reference.json'
      - 'docs/reference/wwise145-linear-exp1-reference.json'
      - 'docs/reference/baron-basic-audio-decoded.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'tools/assets/audio_float_corpus.py'
      - 'tools/assets/export-ahri-charm-audio.py'
      - 'tools/assets/export-baron-basic-audio.py'
      - 'tools/assets/test-baron-basic-audio-export.py'
      - 'tools/assets/test-ahri-charm-audio-export.py'
      - 'docs/reference/ahri-audio-graph.json'
      - 'docs/reference/ahri-audio-decoded.json'
      - 'tools/assets/test-audio-float-corpus.py'
      - '.github/workflows/baron-audio.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/assets/audio/baron-basic/**'
      - 'public/assets/audio/ahri-charm/**'
      - 'public/assets/audio/ahri-orb/**'
      - 'docs/reference/ahri-q-audio-properties.json'
      - 'docs/reference/ahri-orb-gameplay-reference-v2.json'
      - 'tools/assets/read-ahri-q-audio.py'
      - 'tools/assets/test-ahri-q-audio-reading.py'
      - 'tools/assets/export-ahri-orb-audio.py'
      - 'tools/assets/test-ahri-orb-audio-export.py'
      - 'docs/reference/ahri-charm-gameplay-reference.json'
      - 'docs/reference/wwise145-linear-exp1-reference.json'
      - 'docs/reference/baron-basic-audio-decoded.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'tools/assets/audio_float_corpus.py'
      - 'tools/assets/export-ahri-charm-audio.py'
      - 'tools/assets/export-baron-basic-audio.py'
      - 'tools/assets/test-baron-basic-audio-export.py'
      - 'tools/assets/test-ahri-charm-audio-export.py'
      - 'docs/reference/ahri-audio-graph.json'
      - 'docs/reference/ahri-audio-decoded.json'
      - 'tools/assets/test-audio-float-corpus.py'
      - '.github/workflows/baron-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baron-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm exec tsc -- --noEmit
      - name: Check committed audio assets, playback and saved tails
        run: >-
          npm exec vitest -- run
          tests/baron-basic-audio-assets.test.ts
          tests/baron-basic-audio-state.test.ts
          tests/baron-basic-audio-controller.test.ts
          tests/baron-basic-audio-history.test.ts
          tests/ahri-charm-audio-assets.test.ts
          tests/ahri-charm-audio-history.test.ts
          tests/ahri-charm-audio-state.test.ts
          tests/ahri-charm-audio-controller.test.ts
          tests/ahri-charm-gameplay-reference.test.ts
          tests/wwise145-fade.test.ts
          tests/ahri-orb-audio-assets.test.ts
          tests/ahri-orb-audio-policy.test.ts
          tests/ahri-orb-audio-state.test.ts
          tests/ahri-orb-audio-controller.test.ts
          tests/source-envelope.test.ts
          tests/ahri-orb-audio-history.test.ts
          tests/ahri-orb-gameplay-reference.test.ts
          tests/ahri-q.test.ts
      - name: Check float-master format and headroom without private caches
        run: |
          python3 tools/assets/test-audio-float-corpus.py
          python3 -O tools/assets/test-audio-float-corpus.py
      - name: Check Charm whole-closure publication guards without private caches
        run: |
          python3 tools/assets/test-ahri-charm-audio-export.py
          python3 -O tools/assets/test-ahri-charm-audio-export.py
      - name: Check Baron whole-closure publication guards without private caches
        run: |
          python3 tools/assets/test-baron-basic-audio-export.py
          python3 -O tools/assets/test-baron-basic-audio-export.py
      - name: Check Q source action reading without private caches
        run: |
          python3 tools/assets/test-ahri-q-audio-reading.py
          python3 -O tools/assets/test-ahri-q-audio-reading.py
      - name: Check Orb publication guards without private caches
        run: |
          python3 tools/assets/test-ahri-orb-audio-export.py
          python3 -O tools/assets/test-ahri-orb-audio-export.py
