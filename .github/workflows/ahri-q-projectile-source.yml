name: Ahri Q native projectile resource bindings
on:
  push:
    paths:
      - '.github/workflows/ahri-q-projectile-source.yml'
      - 'tools/assets/*ahri*q*projectile*'
      - 'tools/assets/ahri_q_particles.py'
      - 'tools/qa/ahri-q-projectile-bindings.test.mjs'
      - 'docs/reference/ahri/character.json'
      - 'docs/reference/ahri/character.bin'
      - 'docs/reference/ahri/names.json'
      - 'docs/reference/ahri-model.json'
      - 'docs/reference/ahri/q-particles.json'
      - 'docs/reference/ahri/q-projectile-bindings.json'
  pull_request:
    paths:
      - '.github/workflows/ahri-q-projectile-source.yml'
      - 'tools/assets/*ahri*q*projectile*'
      - 'tools/assets/ahri_q_particles.py'
      - 'tools/qa/ahri-q-projectile-bindings.test.mjs'
      - 'docs/reference/ahri/character.json'
      - 'docs/reference/ahri/character.bin'
      - 'docs/reference/ahri/names.json'
      - 'docs/reference/ahri-model.json'
      - 'docs/reference/ahri/q-particles.json'
      - 'docs/reference/ahri/q-projectile-bindings.json'
permissions:
  contents: read
jobs:
  portable-native-reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native spell/resource joins without caches or decoder tools
        run: |
          python3 tools/assets/read-ahri-q-projectile-bindings.py --check
          python3 tools/assets/test-ahri-q-projectile-bindings.py
          python3 -O tools/assets/test-ahri-q-projectile-bindings.py
