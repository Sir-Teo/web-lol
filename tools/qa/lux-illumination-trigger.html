  <head>

    <title>Lux Illumination detonation</title>
    <style>
      body {
        margin: 28px;
        background: #0c1720;
        color: #dce8ee;

    <main>
      <h1>Lux · Illumination detonation</h1>

      </p>
      <label>Age <input id="age" type="range" min="0" max="1.7" step="0.01" value="0.12" /></label
